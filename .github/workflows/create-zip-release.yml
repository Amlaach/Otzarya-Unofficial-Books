name: Auto Zip and Release

on:
  push:
    branches: [main]
    paths:
      - 'ספרים/**'
  workflow_dispatch:
  
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 2
          
      - name: Build ZIPs and Manifest
        run: |
          python3 - <<'PYEOF'
          import os, json, zipfile

          os.makedirs('dist', exist_ok=True)

          def fmt_size(b):
              if b >= 1 << 30: return f"{b / (1 << 30):.1f} GB"
              if b >= 1 << 20: return f"{b / (1 << 20):.1f} MB"
              if b >= 1 << 10: return f"{b / (1 << 10):.0f} KB"
              return f"{b} B"

          def make_zip(src_dir, zip_path):
              with zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_DEFLATED) as zf:
                  for dp, dns, fns in os.walk(src_dir):
                      dns.sort()
                      for fn in sorted(fns):
                          fp = os.path.join(dp, fn)
                          zf.write(fp, os.path.relpath(fp, src_dir))

          def has_files(path):
              return any(fns for _, _, fns in os.walk(path))

          if not os.path.isdir('ספרים'):
              raise SystemExit("תיקיית 'ספרים' לא נמצאה!")

          # ZIP של כל המאגר
          make_zip('ספרים', 'dist/full-library.zip')
          print(f"Created full-library.zip ({fmt_size(os.path.getsize('dist/full-library.zip'))})")

          # אסוף תיקיות ממוינות לפי עומק ואלפבית
          all_dirs = []
          for root, dirs, files in os.walk('ספרים'):
              dirs.sort()
              if root == 'ספרים':
                  continue
              rel = os.path.relpath(root, 'ספרים').replace('\\', '/')
              depth = rel.count('/')
              all_dirs.append((depth, rel, root))
          all_dirs.sort(key=lambda x: (x[0], x[1]))

          # תיקיות שמקבלות ZIP אחד בלבד — ללא ZIPים לתת-תיקיות שלהן
          NO_SUBZIP = [
              'תלמוד ומפרשיו/תלמוד בבלי/שס וגשל',
              'כללים ומערכות/אנציקלופדיה תלמודית',
          ]

          def is_excluded(rel):
              for parent in NO_SUBZIP:
                  if rel.startswith(parent + '/'):
                      return True
              return False

          manifest = []
          counter = 1

          for depth, rel, abs_path in all_dirs:
              if not has_files(abs_path):
                  continue
              if is_excluded(rel):
                  continue

              # שם קובץ ASCII בלבד — GitHub לא תומך בעברית בשם הנכס
              zip_name = f"folder_{counter:04d}.zip"
              counter += 1

              zip_path = os.path.join('dist', zip_name)
              make_zip(abs_path, zip_path)
              size_str = fmt_size(os.path.getsize(zip_path))
              print(f"Created {zip_name} = {rel} ({size_str})")

              parts = rel.split('/')
              parent = '/'.join(parts[:-1])

              manifest.append({
                  "name":  os.path.basename(abs_path),   # שם עברי לתצוגה
                  "path":  rel,
                  "zip":   zip_name,                      # שם ASCII להורדה
                  "label": os.path.basename(abs_path),   # label לגיטאב
                  "parent": parent,
                  "size":  size_str,
                  "depth": depth
              })

          with open('dist/manifest.json', 'w', encoding='utf-8') as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)

          # צור books_data.js עבור התוסף (ללא network access)
          import json as json2
          books_js = 'const BOOKS_DATA = ' + json2.dumps(manifest, ensure_ascii=False) + ';\n'
          with open('dist/books_data.js', 'w', encoding='utf-8') as f:
              f.write(books_js)

          print(f"\nmanifest.json נוצר עם {len(manifest)} ערכים")
          PYEOF

      - name: Commit manifest to repo
        run: |
          cp dist/manifest.json manifest.json
          cp dist/books_data.js books_data.js
          git config user.email "action@github.com"
          git config user.name "GitHub Action"
          git add manifest.json books_data.js
          git diff --cached --quiet || git commit -m "Update manifest + books_data [skip ci]"
          git pull --rebase origin main
          git push

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CURRENT_TIME=$(TZ='Asia/Jerusalem' date +'%d.%m.%Y בשעה %H:%M')
          TAG="v$(date +'%Y%m%d-%H%M%S')"

          gh release create "$TAG" \
            --title "עדכון מאגר ספרים — $CURRENT_TIME" \
            --notes "$(printf '## מאגר ספרים המותאם לאוצריא\n\nעדכון אוטומטי מתאריך **%s**' "$CURRENT_TIME")" \
            --latest

          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Upload Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          export TAG="${{ env.TAG }}"

          python3 - <<'PYEOF'
          import os, json, sys, urllib.parse, urllib.request, subprocess

          token = os.environ['GITHUB_TOKEN']
          repo  = os.environ['REPO']
          tag   = os.environ['TAG']

          # שליפת numeric release ID
          req = urllib.request.Request(
              f"https://api.github.com/repos/{repo}/releases/tags/{tag}",
              headers={'Authorization': f'token {token}',
                       'Accept': 'application/vnd.github+json',
                       'User-Agent': 'otzaria-uploader'}
          )
          with urllib.request.urlopen(req) as resp:
              release_id = json.loads(resp.read())['id']
          print(f"Release ID: {release_id}", flush=True)

          def upload(fpath, fname, label='', ctype='application/zip'):
              print(f"Uploading: {fname} ({label})", flush=True)
              # name חייב להיות ASCII — GitHub לא מקבל עברית
              url = f"https://uploads.github.com/repos/{repo}/releases/{release_id}/assets?name={fname}"
              if label:
                  url += f"&label={urllib.parse.quote(label)}"
              r = subprocess.run([
                  'curl', '--fail-with-body', '-s',
                  '-X', 'POST',
                  '-H', f'Authorization: token {token}',
                  '-H', f'Content-Type: {ctype}',
                  '--data-binary', f'@{fpath}',
                  url
              ])
              if r.returncode != 0:
                  print(f"FAIL: {fname}", flush=True)
                  sys.exit(1)
              print(f"Done: {fname}", flush=True)

          # טען manifest כדי לדעת מה label של כל zip
          with open('dist/manifest.json', encoding='utf-8') as f:
              manifest = json.load(f)
          label_map = {item['zip']: item['label'] for item in manifest}

          # 1. המאגר המלא
          upload('dist/full-library.zip', 'full-library.zip', 'המאגר המלא')

          # 2. manifest.json
          upload('dist/manifest.json', 'manifest.json', '', 'application/json')

          # 3. תיקיות ראשיות (folder_XXXX.zip ללא תת-תיקיות)
          top_zips = sorted([item for item in manifest if item['depth'] == 0],
                            key=lambda x: x['zip'])
          for item in top_zips:
              upload(f"dist/{item['zip']}", item['zip'], item['label'])

          # 4. תתי-תיקיות לפי עומק עולה
          sub_zips = sorted([item for item in manifest if item['depth'] > 0],
                            key=lambda x: (x['depth'], x['zip']))
          for item in sub_zips:
              upload(f"dist/{item['zip']}", item['zip'], item['label'])
          PYEOF

      - name: Cleanup Old Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OLD=$(gh release list --limit 100 --json tagName --jq '.[].tagName' | tail -n +3)
          if [ -n "$OLD" ]; then
            for tag in $OLD; do
              gh release delete "$tag" --yes --cleanup-tag
            done
          fi
      - name: Set up Python for Bot
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Bot Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Run Update Script
        env:
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.event.after }}
          USER_NAME: ${{ secrets.USER_NAME }}
          PASSWORD: ${{ secrets.PASSWORD }}
          TAG: ${{ env.TAG }}
        run: |
          git config core.quotePath false
          python send_update.py
