name: Generate Library Assets
on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Files
        run: |
          # יצירת ה-ZIP הראשי
          zip -r "00_Full-Repository-Download.zip" . -x "*.git*" -x "*.github*"
          
          # יצירת זיפים לפי תיקיות
          if [ -d "ספרים" ]; then
            cd ספרים
            for d in */ ; do
              zip -r "../$(basename "$d").zip" "$d"
            done
            # איסוף קבצים בודדים
            find . -maxdepth 1 -type f -name "*.txt" -exec zip "../קבצים_בודדים.zip" {} +
          fi

      - name: Deploy Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Library Update"
          files: "*.zip"
          overwrite: true # זה ימנע את השגיאה שראית בתמונה
          make_latest: true
