name: Auto Zip and Release (Fixed)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build ZIPs
        run: |
          mkdir -p dist
          # זיפ לכל תיקייה בנפרד
          if [ -d "ספרים" ]; then
            cd ספרים
            for d in */; do
              name="${d%/}"
              # הסרת תווים בעייתיים משם הקובץ למניעת שגיאות 422
              safe_name=$(echo "$name" | tr -d ' ' | tr -cd '[:alnum:]_א-ת')
              zip -r -9 "../dist/${safe_name}.zip" "$d"
            done
            cd ..
          fi
          
      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(date +'%Y%m%d-%H%M%S')"
          # שימוש ב-gh release עם דריסה אם קיים (למרות שה-TAG ייחודי)
          gh release create "$TAG" dist/*.zip --title "מאגר ספרים $TAG" --notes "עדכון אוטומטי"
