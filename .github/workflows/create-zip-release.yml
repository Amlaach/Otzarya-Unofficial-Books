name: Auto Zip and Release (Fixed)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build ZIPs
        run: |
          mkdir -p dist
          if [ -d "ספרים" ]; then
            cd "ספרים"
            for d in */; do
              [ -e "$d" ] || continue
              name="${d%/}"
              # יצירת זיפ עם השם המקורי בעברית בתוך תיקיית dist
              zip -r -9 "../dist/${name}.zip" "$d"
            done
            cd ..
          fi

      - name: Create and Upload Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(date +'%Y%m%d-%H%M%S')"
          
          # יצירת ה-Release תחילה
          gh release create "$TAG" --title "עדכון מאגר $TAG" --notes "עדכון אוטומטי"

          # העלאת קבצים: שם טכני באנגלית (למניעת 404) ותווית בעברית (בשביל ה-Python)
          count=1
          for file in dist/*.zip; do
            if [ -f "$file" ]; then
              ORIGINAL_NAME=$(basename "$file")
              echo "Uploading $ORIGINAL_NAME as archive_${count}.zip"
              
              gh release upload "$TAG" "$file" \
                --name "archive_${count}.zip" \
                --label "$ORIGINAL_NAME" \
                --clobber
              
              count=$((count + 1))
            fi
          done
