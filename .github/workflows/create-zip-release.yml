name: Generate Library Assets
on:
  push:
    branches: [ main ]
    paths:
      - 'ספרים/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set Variables
        id: vars
        run: |
          echo "file_date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
          echo "display_date=$(date +'%d/%m/%Y %H:%M')" >> $GITHUB_OUTPUT
          echo "full_zip=00_כל-המאגר-להורדה_$(date +'%Y-%m-%d').zip" >> $GITHUB_OUTPUT

      - name: Prepare Files
        run: |
          # יצירת הארכיון המלא
          zip -r "${{ steps.vars.outputs.full_zip }}" . -x "*.git*" -x "*.github*" "*.zip"
          
          # יצירת זיפים לתיקיות בתוך "ספרים"
          if [ -d "ספרים" ]; then
            cd "ספרים"
            for d in */ ; do
              [ -e "$d" ] || continue
              zip -r "../$(basename "$d").zip" "$d"
            done
            find . -maxdepth 1 -type f -name "*.txt" -exec zip "../קבצים_בודדים.zip" {} +
          fi

      - name: Create and Upload Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 1. ניהול סבב גרסאות - שימוש ב-delete-tag לניקוי יסודי
          gh release delete backup-version --yes || true
          git tag -d backup-version || true
          push origin :refs/tags/backup-version || true
          
          # העברת הגרסה הנוכחית לגיבוי
          gh release edit latest --tag backup-version --title "גיבוי גרסה קודמת" || true
          
          # 2. הכנת תוכן ההודעה לפי הדרישות שלך
          cat <<EOF > release_notes.md
          # מאגר הספרים המותאמים לתוכנת אוצריא
          
          ### בדף זה תוכלו להוריד את קבצי המאגר המעודכנים ביותר. הגרסה נוצרת באופן אוטומטי בכל פעם שמתווספים ספרים חדשים.
          
          ---
          ## 📥 אפשרויות הורדה:
          
          ### 📦 המאגר המלא (מומלץ)
          **לחצו כאן להורדה ישירה:** ## [⬇️ ${{ steps.vars.outputs.full_zip }}](https://github.com/${{ github.repository }}/releases/download/latest/${{ steps.vars.outputs.full_zip }})
          
          *זהו קובץ המכיל את כל הספרים והתיקיות במבנה הנדרש לתוכנה.*
          
          ---
          ### 📂 הורדה לפי קטגוריות
          להלן הקבצים המחולקים לפי נושאים כפי שהם מופיעים בתיקיות המאגר. רשימת הקבצים המלאה מופיעה מטה.
          
          ---
          **תאריך עדכון אחרון:** ${{ steps.vars.outputs.display_date }}
          EOF

          # 3. יצירת ה-Release (ללא קבצים בינתיים)
          gh release create latest --title "מאגר הספרים המותאמים לתוכנת אוצריא" --notes-file release_notes.md --target main || \
          gh release edit latest --title "מאגר הספרים המותאמים לתוכנת אוצריא" --notes-file release_notes.md

          # 4. העלאת קבצים אחד אחד כדי למנוע קריסה של ה-API בגלל עברית
          for file in *.zip; do
            echo "מעלה קובץ: $file..."
            gh release upload latest "$file" --clobber || echo "נכשל בהעלאת $file, ממשיך הלאה..."
          done
