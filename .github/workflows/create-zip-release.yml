- name: Upload Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ env.TAG }}
        run: |
          set -euo pipefail

          # קבלת release_id
          RELEASE_ID=$(curl -s \
            -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/$REPO/releases/tags/$TAG" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")

          echo "Release ID: $RELEASE_ID"

          count=1
          for f in dist/*.zip; do
            ORIGINAL_NAME=$(basename "$f")
            SAFE_NAME="book_${count}.zip"

            # קידוד URL בנפרד — פותר את בעיית ה-YAML
            ENCODED_LABEL=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$ORIGINAL_NAME'))")
            ENCODED_NAME=$(python3 -c "import urllib.parse; print(urllib.parse.quote('$SAFE_NAME'))")

            UPLOAD_URL="https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=${ENCODED_NAME}&label=${ENCODED_LABEL}"

            echo "מעלה: $ORIGINAL_NAME"
            curl -s --fail \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Content-Type: application/zip" \
              --data-binary @"$f" \
              "$UPLOAD_URL"

            echo "✓ $ORIGINAL_NAME"
            count=$((count + 1))
          done

          echo "✅ הושלם"
