name: Auto Zip and Release (Hebrew Support)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Build ZIPs
        run: |
          mkdir -p dist
          if [ -d "ספרים" ]; then
            cd "ספרים"
            # לולאה שעוברת על התיקיות בצורה בטוחה
            for d in */; do
              [ -e "$d" ] || continue
              name="${d%/}"
              # ניקוי רווחים בלבד, שמירה על עברית
              safe_name=$(echo "$name" | tr -d ' ')
              zip -r -9 "../dist/${safe_name}.zip" "$d"
            done
            cd ..
          fi

      - name: Create Release and Upload Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(date +'%Y%m%d-%H%M%S')"
          
          # 1. יצירת ה-Release תחילה (ללא קבצים)
          gh release create "$TAG" \
            --title "עדכון מאגר $TAG" \
            --notes "העלאה אוטומטית"
          
          # 2. העלאת כל הקבצים מתיקיית dist
          # ה-CLI של GitHub (gh) יודע לטפל בקידוד עברית טוב יותר כשהוא מעלה קבצים קיימים
          if ls dist/*.zip 1> /dev/null 2>&1; then
            gh release upload "$TAG" dist/*.zip --clobber
          else
            echo "No zip files found!"
            exit 1
          fi
