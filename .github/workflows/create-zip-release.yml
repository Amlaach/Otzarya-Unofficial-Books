# תיקון timeout + chunked upload
CHUNK_SIZE = 1024 * 1024  # 1MB per chunk

for attempt in range(3):
    with open(fpath, "rb") as f:
        file_size = os.path.getsize(fpath)
        resp = requests.post(
            upload_url,
            data=f,
            headers={
                **headers,
                "Content-Type": "application/zip",
                "Content-Length": str(file_size)   # חובה ל-GitHub API
            },
            timeout=(10, 600)  # (connect timeout, read/write timeout)
                               # 600 שניות = 10 דקות להעלאה
        )
    if resp.status_code == 201:
        print(f"  ✓ Uploaded successfully")
        break
    print(f"  Attempt {attempt+1} failed: {resp.status_code} {resp.text[:200]}")
    time.sleep(5)
else:
    print(f"  ✗ Failed after 3 attempts: {fname}")
    failed.append(fname)
