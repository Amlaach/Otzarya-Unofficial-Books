name: Zero-Downtime Release with Category Zips

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Get readable timestamp
        id: vars
        run: |
          echo "readable_date=$(date +'%d/%m/%Y %H:%M')" >> $GITHUB_ENV
          echo "tag_date=$(date +'%Y%m%d%H%M%S')" >> $GITHUB_ENV

      - name: Zip Full Repository
        run: zip -r Full-Repository-Download.zip . -x "*.git*" -x "*.github*"

      - name: Zip Each Category Separately
        run: |
          if [ -d "ספרים" ]; then
            cd ספרים
            for d in */ ; do
              folder_name=$(basename "$d")
              zip -r "../${folder_name}.zip" "$d"
            done
            cd ..
          fi

      - name: Create New Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rel-${{ env.tag_date }}
          name: "עדכון מאגר: ${{ env.readable_date }}"
          files: |
            Full-Repository-Download.zip
            *.zip
          make_latest: true
          body: |
            ### 📚 ברוכים הבאים למאגר הספרים של אוצריא
            
            בדף זה תוכלו להוריד את קבצי המאגר המעודכנים ביותר.
            
            **אפשרויות הורדה:**
            1. **המאגר המלא:** הורידו את `Full-Repository-Download.zip`.
            2. **חבילות ספציפיות:** ניתן להוריד קבצי ZIP נפרדים לפי קטגוריות.
            
            ---
            **הערה למשתמשי נטפרי:** הורדת קבצי ה-ZIP מומלצת כדי למנוע חסימות 418.
            
            📅 **תאריך עדכון:** ${{ env.readable_date }}

      - name: Cleanup Old Releases
        uses: dev-drprasad/delete-older-releases@v0.3.0
        with:
          keep_latest: 2
          delete_tags: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
