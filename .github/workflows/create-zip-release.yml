name: Auto Zip and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set UTF-8 locale
        run: |
          sudo locale-gen en_US.UTF-8
          echo "LANG=en_US.UTF-8" >> $GITHUB_ENV
          echo "LC_ALL=en_US.UTF-8" >> $GITHUB_ENV

      - name: Build ZIPs
        run: |
          set -euo pipefail
          export LANG=en_US.UTF-8
          export LC_ALL=en_US.UTF-8

          rm -rf dist
          mkdir -p dist

          if [ ! -d "ספרים" ]; then
            echo "ERROR: תיקיית 'ספרים' לא נמצאה!"
            exit 1
          fi

          cd "ספרים"
          count=0
          for d in */; do
            [ -e "$d" ] || continue
            name="${d%/}"
            echo "→ יוצר ZIP: '${name}.zip'"
            zip -r -9 "../dist/${name}.zip" "$d"
            count=$((count + 1))
          done
          cd ..

          if [ "$count" -eq 0 ]; then
            echo "ERROR: לא נמצאו תיקיות בתוך 'ספרים'!"
            exit 1
          fi

          echo "=== נוצרו $count קבצי ZIP ==="
          ls -lh dist/

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v$(date +'%Y%m%d-%H%M%S')"
          printf "עדכון אוטומטי %s\n\nספרים שעודכנו:\n" "$TAG" > /tmp/notes.txt
          ls dist/*.zip | xargs -I{} basename {} .zip >> /tmp/notes.txt

          gh release create "$TAG" \
            --title "Release $TAG" \
            --notes-file /tmp/notes.txt

          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Upload Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          for f in dist/*.zip; do
            echo "מעלה: $f"
            gh release upload "${{ env.TAG }}" "$f" --clobber
            echo "✓ הועלה: $(basename "$f")"
          done

          echo "✅ כל הקבצים הועלו בהצלחה"
