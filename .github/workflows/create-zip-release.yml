name: Auto Zip and Release (Hebrew Supported)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build ZIPs
        run: |
          mkdir -p dist
          if [ -d "ספרים" ]; then
            cd "ספרים"
            # לולאה שעוברת על התיקיות
            for d in */; do
              [ -e "$d" ] || continue
              name="${d%/}"
              # הסרת רווחים בלבד לשם הקובץ הזמני
              safe_name=$(echo "$name" | tr -d ' ')
              zip -r -9 "../dist/${safe_name}.zip" "$d"
            done
            cd ..
          fi

      - name: Create Release and Upload Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # יצירת תג ייחודי מבוסס זמן
          TAG="v$(date +'%Y%m%d-%H%M%S')"
          
          echo "Creating release $TAG..."
          gh release create "$TAG" \
            --title "עדכון מאגר - $(date +'%d/%m/%Y')" \
            --notes "העלאה אוטומטית של קבצים"

          # העלאת הקבצים אחד אחד עם שימוש ב-Label עבור העברית
          count=1
          for file in dist/*.zip; do
            if [ -f "$file" ]; then
              ORIGINAL_NAME=$(basename "$file")
              echo "Uploading $ORIGINAL_NAME..."
              
              # העלאה: 
              # --name: השם הטכני של הקובץ (באנגלית/מספר) כדי למנוע 404
              # --label: השם שיוצג למשתמש (תומך בעברית)
              gh release upload "$TAG" "$file" \
                --name "archive_${count}.zip" \
                --label "$ORIGINAL_NAME" \
                --clobber
              
              count=$((count + 1))
            fi
          done
