name: Auto Zip and Release

on:
  push:
    branches:
      - main
    paths:
      - 'ספרים/**'
      - 'רשימת ספרים שיש במאגר כרגע'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # מאפשר השוואה לגרסה הקודמת

      - name: Calculate changes
        id: changes
        run: |
          # ספירת קבצים חדשים שנוספו בתיקיית ספרים
          # הפקודה מחפשת קבצים במצב 'A' (Added) בתיקייה הספציפית
          NEW_BOOKS=$(git diff --name-status HEAD~1 HEAD | grep "^A" | grep "ספרים/" | cut -f2- | xargs -I {} basename "{}" | sed 's/\.[^.]*$//' | sort | uniq)
          COUNT=$(echo "$NEW_BOOKS" | grep -v '^$' | wc -l || echo 0)
          
          if [ "$COUNT" -eq "0" ]; then
            echo "summary=בעדכון זה בוצעו תיקוני שמות או עדכוני גרסאות קיימות." >> $GITHUB_OUTPUT
          else
            # יצירת רשימה קצרה של עד 5 ספרים חדשים לדוגמה
            LIST=$(echo "$NEW_BOOKS" | head -n 5 | sed 's/^/* /')
            echo "summary=בעדכון זה נוספו **$COUNT** קבצים חדשים למאגר!  " >> $GITHUB_OUTPUT
            
            # שמירת הרשימה כטקסט מרובה שורות
            echo "details<<EOF" >> $GITHUB_OUTPUT
            echo "$LIST" >> $GITHUB_OUTPUT
            if [ "$COUNT" -gt 5 ]; then echo "* ...ועוד" >> $GITHUB_OUTPUT; fi
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Prepare ZIP files
        run: |
          mkdir -p dist
          # יצירת התיקייה הזמנית למאגר המלא
          mkdir temp_full_archive
          cp -r "ספרים" temp_full_archive/
          cp "רשימת ספרים שיש במאגר כרגע" temp_full_archive/
          
          cd temp_full_archive
          zip -r "../dist/00_Full_Library_Collection.zip" .
          cd ..

          # יצירת זיפים נפרדים לכל תיקייה
          find "ספרים" -maxdepth 1 -type d -not -path "ספרים" | while read -r dir; do
            name=$(basename "$dir")
            zip -r "dist/${name}.zip" "$dir"
          done
          
          cp "רשימת ספרים שיש במאגר כרגע" dist/

      - name: Get current date
        id: date
        run: echo "date=$(date +'%d/%m/%Y %H:%M')" >> $GITHUB_OUTPUT

      - name: Create or Update Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: מאגר ספרים מותאם למערכת
          body: |
            # מאגר ספרים מותאם למערכת
            
            **תאריך עדכון הגרסה האחרונה:** ${{ steps.date.outputs.date }}
            
            ### 🆕 מה חדש בעדכון זה?
            ${{ steps.changes.outputs.summary }}
            ${{ steps.changes.outputs.details }}
            
            ---
            ### 📥 הורדת המאגר המלא (כל הספרים)
            הקובץ מכיל את כל הספרים, התיקיות וקובץ הפירוט:
            
            ## ➔ [לחצו כאן להורדת כל המאגר המלא במקשה אחת](https://github.com/${{ github.repository }}/releases/download/latest/00_Full_Library_Collection.zip)
            
            ---
            ### 📄 רשימת הספרים המלאה
            [לחצו כאן להורדת קובץ רשימת הספרים בלבד](https://github.com/${{ github.repository }}/releases/download/latest/רשימת.ספרים.שיש.במאגר.כרגע)
            
            ---
            ### 📂 הורדת תיקיות בנפרד
            להלן התיקיות המופרדות. ניתן להוריד כל חלק מרשימת ה-**Assets** למטה.
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
