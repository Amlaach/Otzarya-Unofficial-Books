name: Auto Zip and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build ZIPs
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist

          if [ ! -d "ספרים" ]; then
            echo "❌ תיקיית 'ספרים' לא נמצאה!"
            exit 1
          fi

          # 1. ZIP של כל המאגר
          cd "ספרים"
          zip -r "../dist/full-library.zip" .
          cd ..

          # 2. ZIP נפרד לכל ספר
          cd "ספרים"
          for d in */; do
            [ -e "$d" ] || continue
            name="${d%/}"
            cd "$d"
            zip -r "../../dist/${name}.zip" .
            cd ..
          done
          cd ..

      - name: Create Release
        id: create_rel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          
          CURRENT_TIME=$(date +'%d.%m.%Y בשעה %H:%M')
          TAG="v$(date +'%Y%m%d-%H%M%S')"
          PERMALINK="https://github.com/${REPO}/releases/latest/download/full-library.zip"
          
          RELEASE_BODY=$(cat <<EOF
          # מאגר ספרים המותאם לאוצריא
          ### קבצים אלו מתעדכנים באופן אוטומטי עם כל שינוי שנעשה בספרים
          #### גירסה זו מעודכנת לתאריך: $CURRENT_TIME
          
          ---
          
          ### [להורדת המאגר המלא (קישור קבוע) - לחץ כאן]($PERMALINK)
          
          > **שימו לב:** הקישור למעלה תמיד יוריד את הגרסה הכי מעודכנת של המאגר.
          
          ---
          **רשימת הספרים הבודדים להורדה:**
          EOF
          )

          gh release create "$TAG" \
            --title "מאגר ספרים מעודכן - $CURRENT_TIME" \
            --notes "$RELEASE_BODY" \
            --latest
            
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Upload Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG=${{ env.TAG }}
          RELEASE_DATA=$(curl -s -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/$REPO/releases/tags/$TAG")
          RELEASE_ID=$(echo "$RELEASE_DATA" | python3 -c "import sys, json; print(json.load(sys.stdin).get('id', ''))")

          upload_file() {
            local fpath="$1"
            local safe_name="$2"
            local label="$3"
            ENCODED_NAME=$(echo -n "$safe_name" | python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.stdin.read()))")
            ENCODED_LABEL=$(echo -n "$label" | python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.stdin.read()))")

            curl -s -o /tmp/upload_resp.txt -w "%{http_code}" \
              -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Content-Type: application/zip" \
              --data-binary @"$fpath" \
              "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=${ENCODED_NAME}&label=${ENCODED_LABEL}"
          }

          upload_file "dist/full-library.zip" "full-library.zip" "המאגר המלא - להורדה ישירה"

          count=1
          for f in dist/*.zip; do
            [ -e "$f" ] || continue
            ORIGINAL_NAME=$(basename "$f")
            [ "$ORIGINAL_NAME" = "full-library.zip" ] && continue
            upload_file "$f" "book_${count}.zip" "$ORIGINAL_NAME"
            count=$((count + 1))
          done

      - name: Cleanup Old Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "מנקה גרסאות ישנות (משאיר רק 2 אחרונות)..."
          
          # קבלת רשימת כל ה-Tags של ה-Releases, מיון מהחדש לישן, ודילוג על ה-2 הראשונים
          OLD_RELEASES=$(gh release list --limit 100 | awk '{print $1}' | tail -n +3)
          
          for tag in $OLD_RELEASES; do
            echo "מוחק את גרסה: $tag"
            gh release delete "$tag" --yes --cleanup-tag
          done
