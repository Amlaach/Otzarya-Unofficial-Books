name: Auto Zip and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      # 📥 שליפת הקוד
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 🧰 התקנת GitHub CLI
      - name: Install GitHub CLI
        run: sudo apt-get update && sudo apt-get install -y gh zip

      # 📦 יצירת קבצי ZIP
      - name: Build ZIP files
        run: |
          set -e
          mkdir -p dist

          echo "📦 FULL ZIP..."
          zip -r -9 dist/00_FULL_COLLECTION.zip . \
            -x "*.git*" "dist/*" ".github/*"

          echo "📁 ZIP לכל תיקייה..."
          shopt -s nullglob
          for d in */; do
            if [[ "$d" != ".git/" && "$d" != "dist/" && "$d" != ".github/" ]]; then
              name="${d%/}"
              zip -r -9 "dist/${name}.zip" "$d"
            fi
          done

          echo "📄 ZIP לקבצים בודדים..."
          for f in *; do
            if [[ -f "$f" ]]; then
              name="${f%.*}"
              zip -j -9 "dist/${name}.zip" "$f"
            fi
          done

          echo "✅ תוצאה:"
          ls -lh dist

      # 🚀 יצירת Release
      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          TAG="v$(date +'%Y%m%d-%H%M%S')"

          echo "Creating release $TAG"

          gh release create "$TAG" dist/* \
            --title "מאגר ספרים - $TAG" \
            --notes "עודכן בתאריך: $(date +'%d/%m/%Y %H:%M:%S')"

      # 🧹 שמירת רק 3 גרסאות
      - name: Keep only last 3 releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          echo "Cleaning old releases..."

          releases=$(gh release list --limit 100 --json tagName --jq '.[].tagName')

          count=0
          for tag in $releases; do
            count=$((count+1))
            if [ $count -gt 3 ]; then
              echo "Deleting $tag"
              gh release delete "$tag" --yes --cleanup-tag
            fi
          done
