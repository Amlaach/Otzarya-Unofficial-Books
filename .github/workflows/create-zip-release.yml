name: Auto Zip and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build ZIPs
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist

          if [ ! -d "ספרים" ]; then
            echo "❌ שגיאה: תיקיית 'ספרים' לא נמצאה!"
            exit 1
          fi

          cd "ספרים"
          count=0
          for d in */; do
            [ -e "$d" ] || continue
            name="${d%/}"
            echo "→ יוצר ZIP: '${name}.zip'"
            zip -r -9 "../dist/${name}.zip" "$d"
            count=$((count + 1))
          done
          cd ..

          if [ "$count" -eq 0 ]; then
            echo "❌ שגיאה: לא נמצאו תיקיות בתוך 'ספרים'!"
            exit 1
          fi
          echo "✅ נוצרו $count קבצי ZIP"

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v$(date +'%Y%m%d-%H%M%S')"

          gh release create "$TAG" \
            --title "עדכון מאגר $TAG" \
            --notes "עדכון אוטומטי של הספרייה"

          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Upload Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          RELEASE_DATA=$(curl -s \
            -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/$REPO/releases/tags/${{ env.TAG }}")

          RELEASE_ID=$(echo "$RELEASE_DATA" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id', ''))")

          if [ -z "$RELEASE_ID" ] || [ "$RELEASE_ID" = "None" ]; then
            echo "❌ לא הצלחתי למצוא את ה-Release ID"
            echo "תגובת השרת: $RELEASE_DATA"
            exit 1
          fi

          echo "Release ID: $RELEASE_ID"

          count=1
          for f in dist/*.zip; do
            [ -e "$f" ] || continue

            ORIGINAL_NAME=$(basename "$f")
            SAFE_NAME="book_${count}.zip"

            # ✅ התיקון: המשתנה לפני הפקודה
            ENCODED_LABEL=$(N="$ORIGINAL_NAME" python3 -c "import urllib.parse, os; print(urllib.parse.quote(os.environ['N']))")
            ENCODED_NAME=$(N="$SAFE_NAME"      python3 -c "import urllib.parse, os; print(urllib.parse.quote(os.environ['N']))")

            UPLOAD_URL="https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=${ENCODED_NAME}&label=${ENCODED_LABEL}"

            echo "מעלה: $ORIGINAL_NAME (בתור $SAFE_NAME)..."

            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Content-Type: application/zip" \
              --data-binary @"$f" \
              "$UPLOAD_URL")

            if [ "$HTTP_CODE" -ne 201 ]; then
              echo "❌ שגיאה בהעלאת $ORIGINAL_NAME (קוד HTTP: $HTTP_CODE)"
              exit 1
            fi

            echo "✓ הושלם: $ORIGINAL_NAME"
            count=$((count + 1))
          done

          echo "✅ כל הקבצים הועלו בהצלחה!"
