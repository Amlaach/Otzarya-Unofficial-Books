name: Auto Zip and Release

on:
  push:
    branches:
      - main  # או שם הבראנץ' הראשי שלך (למשל master)
    paths-ignore: main
      - '.github/**'

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Prepare ZIP files
        run: |
          mkdir dist
          # יצירת קובץ זיפ של כל המאגר (ללא תיקיות מערכת של גיט וגיטהאב)
          zip -r "dist/00_כל_המאגר_המלא.zip" . -x "*.git*" ".github/*" "dist/*"
          
          # לולאה שעוברת על כל תיקייה בשורש המאגר ויוצרת ממנה זיפ נפרד
          for dir in */; do
            if [ -d "$dir" ] && [ "$dir" != "dist/" ] && [ "$dir" != ".github/" ]; then
              zip -r "dist/${dir%/}.zip" "$dir"
            fi
          done

      - name: Get current date
        id: date
        run: echo "date=$(date +'%d/%m/%Y %H:%M')" >> $GITHUB_OUTPUT

      - name: Create or Update Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: מאגר ספרים מותאם לאוצריא
          body: |
            # מאגר ספרים מותאם לאוצריא
            
            **תאריך עדכון הגרסה האחרונה:** ${{ steps.date.outputs.date }}
            
            ---
            ### 📥 הורדת המאגר המלא
            מומלץ למשתמשים שרוצים את כל התוכן בבת אחת. הקובץ הבא מכיל את כל הספרים והתיקיות במאגר:
            **הורד את הקובץ: [00_כל_המאגר_המלא.zip]**
            
            ---
            ### 📂 הורדת תיקיות בנפרד
            להלן רשימת הקבצים המופרדים לפי נושאים/תיקיות.
            
            > **הסבר:** הקבצים בדף זה מתעדכנים אוטומטית בכל פעם שמבוצע שינוי או עדכון במאגר הספרים.
          files: dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
