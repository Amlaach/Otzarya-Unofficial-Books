- name: Upload Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          TAG=$(cat $GITHUB_ENV | grep "^TAG=" | cut -d= -f2)
          echo "TAG is: $TAG"

          python3 << 'PYEOF'
          import os, requests, urllib.parse, time, sys

          token = os.environ["GITHUB_TOKEN"]
          repo  = os.environ["REPO"]

          # קריאת TAG ישירות מ-GITHUB_ENV
          tag = None
          with open(os.environ["GITHUB_ENV"]) as f:
              for line in f:
                  if line.startswith("TAG="):
                      tag = line.strip().split("=", 1)[1]
          
          if not tag:
              print("ERROR: TAG not found!")
              sys.exit(1)
          
          print(f"TAG: {tag}")

          headers = {
              "Authorization": f"token {token}",
              "Accept": "application/vnd.github.v3+json"
          }

          # קבלת release id
          r = requests.get(
              f"https://api.github.com/repos/{repo}/releases/tags/{tag}",
              headers=headers
          )
          r.raise_for_status()
          release_id = r.json()["id"]
          print(f"Release ID: {release_id}")

          # העלאת קבצים
          files = sorted([f for f in os.listdir("dist") if f.endswith(".zip")])
          if not files:
              print("ERROR: no zip files in dist/")
              sys.exit(1)

          for i, fname in enumerate(files, 1):
              fpath = os.path.join("dist", fname)
              safe_name  = f"book_{i}.zip"
              label      = fname  # שם עברי מקורי
              
              encoded_name  = urllib.parse.quote(safe_name)
              encoded_label = urllib.parse.quote(label)
              upload_url = f"https://uploads.github.com/repos/{repo}/releases/{release_id}/assets?name={encoded_name}&label={encoded_label}"

              print(f"Uploading: {fname} as {safe_name}")
              with open(fpath, "rb") as f:
                  resp = requests.post(
                      upload_url,
                      data=f,
                      headers={
                          "Authorization": f"token {token}",
                          "Content-Type": "application/zip",
                          "Content-Length": str(os.path.getsize(fpath))
                      },
                      timeout=(10, None)
                  )
              if resp.status_code == 201:
                  print(f"✓ {fname}")
              else:
                  print(f"✗ {fname}: {resp.status_code} {resp.text[:200]}")
                  sys.exit(1)
              
              time.sleep(1)

          print("✅ הושלם")
          PYEOF
