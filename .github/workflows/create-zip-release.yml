name: Auto Zip and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          mkdir -p dist
          # איחוד כל התוכן לקובץ אחד גדול (780MB+)
          zip -r "dist/00_Full_Library_Collection.zip" "ספרים" "רשימת ספרים שיש במאגר כרגע"
          
          # יצירת קבצים נפרדים לכל תיקייה
          cd "ספרים"
          for d in */; do
            zip -r "../dist/${d%/}.zip" "$d"
          done

      - name: Upload
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create latest dist/* \
            --title "מאגר ספרים" \
            --notes "עדכון: $(date +'%d/%m/%Y')" \
            --overwrite
