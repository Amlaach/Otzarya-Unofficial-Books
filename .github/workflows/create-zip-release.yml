name: Auto Zip and Release (Final Fix)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build ZIPs
        run: |
          mkdir -p dist
          if [ -d "ספרים" ]; then
            cd "ספרים"
            for d in */; do
              [ -e "$d" ] || continue
              name="${d%/}"
              # יצירת הזיפ עם השם המקורי
              zip -r -9 "../dist/${name}.zip" "$d"
            done
            cd ..
          fi

      - name: Create Release
        id: create_release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(date +'%Y%m%d-%H%M%S')"
          gh release create "$TAG" --title "עדכון מאגר $TAG" --notes "אוטומציה"
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Upload Assets (Python Safe Way)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          python3 - <<EOF
          import os, requests, urllib.parse
          
          token = os.getenv("GITHUB_TOKEN")
          repo = os.getenv("REPO")
          tag = os.getenv("TAG")
          
          # 1. קבלת ה-ID של ה-Release שנוצר
          release_url = f"https://api.github.com/repos/{repo}/releases/tags/{tag}"
          headers = {"Authorization": f"token {token}"}
          r = requests.get(release_url, headers=headers)
          r.raise_for_status()
          release_id = r.json()["id"]
          
          # 2. העלאת כל הקבצים מתיקיית dist
          for fname in os.listdir("dist"):
              if fname.endswith(".zip"):
                  fpath = os.path.join("dist", fname)
                  # קידוד השם לעברית בטוחה ל-URL
                  encoded_name = urllib.parse.quote(fname)
                  upload_url = f"https://uploads.github.com/repos/{repo}/releases/{release_id}/assets?name={encoded_name}"
                  
                  print(f"Uploading {fname}...")
                  with open(fpath, "rb") as f:
                      u_headers = {
                          "Authorization": f"token {token}",
                          "Content-Type": "application/zip"
                      }
                      u_r = requests.post(upload_url, data=f, headers=u_headers)
                      if u_r.status_code != 201:
                          print(f"Failed to upload {fname}: {u_r.text}")
                          exit(1)
          print("All assets uploaded successfully!")
          EOF
