name: Auto Zip and Release (Advanced)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y gh zip coreutils

      - name: Build ZIP files
        run: |
          set -e
          mkdir -p dist

          echo "📦 FULL ZIP..."
          zip -r -9 dist/00_FULL_COLLECTION.zip ספרים "רשימת ספרים שיש במאגר כרגע"

          echo "📁 ZIP לכל תיקייה בתוך 'ספרים'..."
          shopt -s nullglob
          if [ -d "ספרים" ]; then
            cd ספרים
            for d in */; do
              [ -d "$d" ] || continue
              if [ "$(find "$d" -type f | wc -l)" -gt 0 ]; then
                name="${d%/}"
                zip -r -9 "../dist/${name}.zip" "$d"
              else
                echo "⏭️ מדלג על תיקייה ריקה: $d"
              fi
            done
            cd ..
          fi

          echo "📄 ZIP לקבצים בודדים ברוט..."
          for f in *; do
            if [[ -f "$f" ]]; then
              name="${f%.*}"
              zip -j -9 "dist/${name}.zip" "$f"
            fi
          done

          echo "🔐 יצירת checksums..."
          cd dist
          sha256sum * > checksums.txt
          cd ..

          echo "✅ תוצאה:"
          ls -lh dist

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          TAG="v$(date +'%Y%m%d-%H%M%S')"

          gh release create "$TAG" dist/* \
            --title "מאגר ספרים - $TAG" \
            --notes "עודכן בתאריך: $(date +'%d/%m/%Y %H:%M:%S')"

      - name: Cleanup old releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e

          releases=$(gh release list --limit 100 --json tagName --jq '.[].tagName')

          count=0
          for tag in $releases; do
            count=$((count+1))
            if [ $count -gt 3 ]; then
              gh release delete "$tag" --yes --cleanup-tag
            fi
          done
