name: Auto Zip and Release (Stable Full Lib)

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build ZIPs
        run: |
          set -euo pipefail
          rm -rf dist && mkdir -p dist

          # 1. יצירת ZIP של כל המאגר (שם אנגלי קבוע לקישור קבוע)
          echo "→ יוצר ZIP של כל המאגר..."
          zip -r -9 "dist/full-library.zip" "ספרים/"

          # 2. יצירת ZIP נפרד לכל ספר
          cd "ספרים"
          count=0
          for d in */; do
            [ -e "$d" ] || continue
            name="${d%/}"
            zip -r -9 "../dist/${name}.zip" "$d"
            count=$((count + 1))
          done
          echo "✅ נוצרו $count ספרים + מאגר מלא"

      - name: Create Release
        id: create_rel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v$(date +'%Y%m%d-%H%M%S')"
          gh release create "$TAG" --title "עדכון מאגר $TAG" --notes "אוטומציה"
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Upload Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          # קבלת ה-ID של ה-Release
          RELEASE_DATA=$(curl -s -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/$REPO/releases/tags/${{ env.TAG }}")
          RELEASE_ID=$(echo "$RELEASE_DATA" | python3 -c "import sys,json; print(json.load(sys.stdin).get('id', ''))")

          # א. העלאת המאגר המלא (שם אנגלי, תווית עברית)
          echo "מעלה מאגר מלא..."
          LABEL_FULL=$(python3 -c "import urllib.parse; print(urllib.parse.quote('📚 המאגר המלא.zip'))")
          curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: token $GITHUB_TOKEN" \
            -H "Content-Type: application/zip" \
            --data-binary @"dist/full-library.zip" \
            "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=full-library.zip&label=$LABEL_FULL"

          # ב. העלאת ספרים בודדים
          count=1
          for f in dist/*.zip; do
            ORIGINAL_NAME=$(basename "$f")
            [ "$ORIGINAL_NAME" = "full-library.zip" ] && continue
            
            SAFE_NAME="book_${count}.zip"
            # קידוד השם המקורי (עברית) לתוך ה-Label
            ENCODED_LABEL=$(N="$ORIGINAL_NAME" python3 -c "import urllib.parse,os; print(urllib.parse.quote(os.environ['N']))")
            
            echo "מעלה: $ORIGINAL_NAME..."
            curl -s -o /dev/null -w "%{http_code}" -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Content-Type: application/zip" \
              --data-binary @"$f" \
              "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=$SAFE_NAME&label=$ENCODED_LABEL"
            
            count=$((count + 1))
          done
