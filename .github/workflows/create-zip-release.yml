- name: Upload Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ env.TAG }}
        run: |
          set -euo pipefail

          # קבלת release_id לפי TAG
          RELEASE_ID=$(curl -s \
            -H "Authorization: token $GITHUB_TOKEN" \
            "https://api.github.com/repos/$REPO/releases/tags/$TAG" \
            | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")

          echo "Release ID: $RELEASE_ID"

          count=1
          for f in dist/*.zip; do
            ORIGINAL_NAME=$(basename "$f")
            SAFE_NAME="book_${count}.zip"

            echo "מעלה: $ORIGINAL_NAME בתור $SAFE_NAME (label: $ORIGINAL_NAME)"

            curl -s --fail \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Content-Type: application/zip" \
              --data-binary @"$f" \
              "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$SAFE_NAME")&label=$(python3 -c "import urllib.parse,sys; print(urllib.parse.quote(sys.argv[1]))" "$ORIGINAL_NAME")"

            echo "✓ הועלה: $ORIGINAL_NAME"
            count=$((count + 1))
          done

          echo "✅ כל הקבצים הועלו בהצלחה"
