name: Auto Zip and Release

on:
  push:
    branches:
      - main
    paths:
      - 'ספרים/**'
      - 'רשימת ספרים שיש במאגר כרגע'
  workflow_dispatch: # מאפשר הרצה ידנית לבדיקה

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Calculate changes
        id: changes
        run: |
          NEW_BOOKS=$(git diff --name-status HEAD~1 HEAD | grep "^A" | grep "ספרים/" | cut -f2- | xargs -I {} basename "{}" | sed 's/\.[^.]*$//' | sort | uniq)
          COUNT=$(echo "$NEW_BOOKS" | grep -v '^$' | wc -l || echo 0)
          if [ "$COUNT" -eq "0" ]; then
            echo "summary=בוצע עדכון כללי למאגר." >> $GITHUB_OUTPUT
          else
            LIST=$(echo "$NEW_BOOKS" | head -n 5 | sed 's/^/* /')
            echo "summary=נוספו **$COUNT** קבצים חדשים למאגר!" >> $GITHUB_OUTPUT
            echo "details<<EOF" >> $GITHUB_OUTPUT
            echo "$LIST" >> $GITHUB_OUTPUT
            if [ "$COUNT" -gt 5 ]; then echo "* ...ועוד" >> $GITHUB_OUTPUT; fi
            echo "EOF" >> $GITHUB_OUTPUT
          fi

      - name: Prepare ZIP files
        run: |
          mkdir -p dist
          # יצירת המאגר המלא
          zip -r "dist/00_Full_Library_Collection.zip" "ספרים" "רשימת ספרים שיש במאגר כרגע"

          # יצירת זיפים נפרדים לתתי-תיקיות בתוך "ספרים"
          # אנחנו מוודאים ששם הקובץ לא מכיל תווים בעייתיים
          find "ספרים" -maxdepth 1 -mindepth 1 -type d | while read -r dir; do
            name=$(basename "$dir")
            zip -r "dist/${name}.zip" "$dir"
          done
          
          # העתקת קובץ הרשימה כקובץ בודד
          cp "רשימת ספרים שיש במאגר כרגע" "dist/רשימת_ספרים_במאגר.txt"

      - name: Get current date
        id: date
        run: echo "date=$(date +'%d/%m/%Y %H:%M')" >> $GITHUB_OUTPUT

      - name: Create or Update Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: latest
          name: מאגר ספרים מותאם לאוצריא
          files: dist/*
          overwrite: true # מאפשר דריסת קבצים קיימים
          body: |
            # מאגר ספרים מותאם לאוצריא
            
            **תאריך עדכון אחרון:** ${{ steps.date.outputs.date }}
            
            ### 🆕 מה חדש בעדכון זה?
            ${{ steps.changes.outputs.summary }}
            ${{ steps.changes.outputs.details }}
            
            ---
            ### 📥 הורדת המאגר המלא
            מומלץ למשתמשים שרוצים את כל התוכן בבת אחת:
            ## ➔ [לחצו כאן להורדת כל המאגר המלא](https://github.com/${{ github.repository }}/releases/download/latest/00_Full_Library_Collection.zip)
            
            ---
            ### 📄 רשימת הספרים
            [צפייה ברשימת הספרים המלאה במאגר](https://github.com/${{ github.repository }}/releases/download/latest/רשימת_ספרים_במאגר.txt)
            
            ---
            ### 📂 הורדת תיקיות בנפרד
            ניתן להוריד כל תיקייה בנפרד מרשימת ה-Assets למטה.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
