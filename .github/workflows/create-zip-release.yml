name: Auto Zip and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Build ZIPs and Manifest
        run: |
          python3 - <<'PYEOF'
          import os, json, zipfile

          os.makedirs('dist', exist_ok=True)

          def fmt_size(b):
              if b >= 1 << 30: return f"{b / (1 << 30):.1f} GB"
              if b >= 1 << 20: return f"{b / (1 << 20):.1f} MB"
              if b >= 1 << 10: return f"{b / (1 << 10):.0f} KB"
              return f"{b} B"

          def make_zip(src_dir, zip_path):
              with zipfile.ZipFile(zip_path, 'w', zipfile.ZIP_DEFLATED) as zf:
                  for dp, dns, fns in os.walk(src_dir):
                      dns.sort()
                      for fn in sorted(fns):
                          fp = os.path.join(dp, fn)
                          zf.write(fp, os.path.relpath(fp, src_dir))

          def has_files(path):
              return any(fns for _, _, fns in os.walk(path))

          if not os.path.isdir('ספרים'):
              raise SystemExit("תיקיית 'ספרים' לא נמצאה!")

          make_zip('ספרים', 'dist/full-library.zip')
          print(f"Created full-library.zip ({fmt_size(os.path.getsize('dist/full-library.zip'))})")

          all_dirs = []
          for root, dirs, files in os.walk('ספרים'):
              dirs.sort()
              if root == 'ספרים':
                  continue
              rel = os.path.relpath(root, 'ספרים').replace('\\', '/')
              depth = rel.count('/')
              all_dirs.append((depth, rel, root))

          all_dirs.sort(key=lambda x: (x[0], x[1]))

          manifest = []

          for depth, rel, abs_path in all_dirs:
              if not has_files(abs_path):
                  print(f"Skipping empty: {rel}")
                  continue

              zip_name = rel.replace('/', '__').replace(' ', '_') + '.zip'
              zip_path = os.path.join('dist', zip_name)

              make_zip(abs_path, zip_path)
              size_str = fmt_size(os.path.getsize(zip_path))
              print(f"Created {zip_name} ({size_str})")

              parts = rel.split('/')
              parent = '/'.join(parts[:-1])

              manifest.append({
                  "name": os.path.basename(abs_path),
                  "path": rel,
                  "zip": zip_name,
                  "parent": parent,
                  "size": size_str,
                  "depth": depth
              })

          with open('dist/manifest.json', 'w', encoding='utf-8') as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)

          print(f"\nmanifest.json נוצר עם {len(manifest)} ערכים")
          PYEOF

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CURRENT_TIME=$(date +'%d.%m.%Y בשעה %H:%M')
          TAG="v$(date +'%Y%m%d-%H%M%S')"

          gh release create "$TAG" \
            --title "עדכון מאגר ספרים — $CURRENT_TIME" \
            --notes "$(printf '## מאגר ספרים המותאם לאוצריא\n\nעדכון אוטומטי מתאריך **%s**\n\n---\n\n### סדר הקבצים:\n1. המאגר המלא\n2. תיקיות ראשיות\n3. תתי-תיקיות לפי עומק' "$CURRENT_TIME")" \
            --latest

          echo "TAG=$TAG" >> "$GITHUB_ENV"

      - name: Upload Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ env.TAG }}"

          # 1. המאגר המלא
          gh release upload "$TAG" dist/full-library.zip
          echo "Uploaded: full-library.zip"

          # 2. manifest.json
          gh release upload "$TAG" dist/manifest.json
          echo "Uploaded: manifest.json"

          # 3. תיקיות ראשיות — ללא __ בשם
          for f in dist/*.zip; do
            fname=$(basename "$f")
            [ "$fname" = "full-library.zip" ] && continue
            [[ "$fname" == *"__"* ]] && continue
            gh release upload "$TAG" "$f"
            echo "Uploaded: $fname"
          done

          # 4. תתי-תיקיות — לפי עומק עולה ואז אלפבית
          python3 - <<'PYEOF'
          import os, subprocess, sys

          tag = os.environ['TAG']
          sub = sorted(
              [f for f in os.listdir('dist') if f.endswith('.zip') and '__' in f],
              key=lambda f: (f.count('__'), f)
          )
          for fname in sub:
              r = subprocess.run(
                  ['gh', 'release', 'upload', tag, f'dist/{fname}'],
                  capture_output=True, text=True
              )
              if r.returncode != 0:
                  print(f'FAIL: {fname}\n{r.stderr}', flush=True)
                  sys.exit(1)
              print(f'Uploaded: {fname}', flush=True)
          PYEOF

      - name: Cleanup Old Releases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OLD=$(gh release list --limit 100 --json tagName --jq '.[].tagName' | tail -n +3)
          if [ -n "$OLD" ]; then
            for tag in $OLD; do
              gh release delete "$tag" --yes --cleanup-tag
            done
          fi
