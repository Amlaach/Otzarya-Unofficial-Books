name: Auto Zip and Release

on:
  push:
    branches: [main]
  workflow_dispatch:

# הגדרה גלובלית ל"שגר ושכח"
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build ZIPs
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist

          if [ ! -d "ספרים" ]; then
            echo "❌ תיקיית 'ספרים' לא נמצאה!"
            exit 1
          fi

          # 1. ZIP של כל המאגר
          cd "ספרים"
          zip -r -9 "../dist/full-library.zip" .
          cd ..

          # 2. ZIP נפרד לכל ספר
          cd "ספרים"
          for d in */; do
            [ -e "$d" ] || continue
            name="${d%/}"
            cd "$d"
            zip -r -9 "../../dist/${name}.zip" .
            cd ..
          done
          cd ..

      - name: Create Release
        id: create_rel
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="v$(date +'%Y%m%d-%H%M%S')"
          gh release create "$TAG" --title "Release $TAG" --notes "עדכון אוטומטי"
          echo "TAG=$TAG" >> $GITHUB_ENV

      - name: Upload Assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG=${{ env.TAG }}
          RELEASE_DATA=$(curl -s -H "Authorization: token $GITHUB_TOKEN" "https://api.github.com/repos/$REPO/releases/tags/$TAG")
          RELEASE_ID=$(echo "$RELEASE_DATA" | python3 -c "import sys, json; print(json.load(sys.stdin).get('id', ''))")

          upload_file() {
            local fpath="$1"
            local safe_name="$2"
            local label="$3" # ללא אימוג'ים!

            ENCODED_NAME=$(echo -n "$safe_name" | python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.stdin.read()))")
            ENCODED_LABEL=$(echo -n "$label" | python3 -c "import urllib.parse, sys; print(urllib.parse.quote(sys.stdin.read()))")

            echo "Uploading: $label..."
            HTTP_CODE=$(curl -s -o /tmp/upload_resp.txt -w "%{http_code}" \
              -X POST \
              -H "Authorization: token $GITHUB_TOKEN" \
              -H "Content-Type: application/zip" \
              --data-binary @"$fpath" \
              "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=${ENCODED_NAME}&label=${ENCODED_LABEL}")

            if [ "$HTTP_CODE" -ne 201 ]; then
              echo "❌ שגיאה בהעלאת $label (קוד: $HTTP_CODE)"
              cat /tmp/upload_resp.txt
              exit 1
            fi
          }

          # העלאת המאגר (טקסט עברי נקי - בלי אימוג'י ספר)
          upload_file "dist/full-library.zip" "full-library.zip" "המאגר המלא"

          # העלאת ספרים בודדים
          count=1
          for f in dist/*.zip; do
            [ -e "$f" ] || continue
            ORIGINAL_NAME=$(basename "$f")
            [ "$ORIGINAL_NAME" = "full-library.zip" ] && continue
            upload_file "$f" "book_${count}.zip" "$ORIGINAL_NAME"
            count=$((count + 1))
          done
